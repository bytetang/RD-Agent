# Prompts for the auto_alpha factor scenario.
#
# Templates here are rendered via rdagent.utils.agent.tpl.T(...) with Jinja2.
# Section keys are referenced by AutoAlphaScenario / proposal classes / coder.

# ------------------------------------------------------------------
# Scenario description sections (used by AutoAlphaScenario)
# ------------------------------------------------------------------

auto_alpha_background: |-
  You are an autonomous alpha-factor researcher working on cryptocurrency
  spot markets (Binance, BTCUSDT). Your job: discover pandas-based features
  ("factors") that improve a fixed downstream baseline across multiple
  prediction tasks simultaneously.

  Infrastructure (auto-alpha-playground):
    - fetcher: per-day raw 1s / 1m klines from Binance Vision.
    - featurizer: registered feature + label plugins, per-day parquet.
    - trainer: time-split train/val/test, fits a registered model, reports
      metrics (logloss/AUC/acc for classification, IC/ICIR/RMSE for regression).
    - bench: the canonical benchmark CLI. `python -m bench run --features X`
      featurizes + sweeps a panel of cells + diffs vs `benchmarks/baseline.csv`.

  Each round we shell out to `python -m bench run --features <your_feature>
  --cells <preset>` which sweeps a panel of cells:
    - classification (label = `bucket_binary`): val headline is val_acc (↑)
    - regression (label = `forward_logret`):     val headline is val_ic_pearson (↑, signed)

  Each cell is (interval × horizon × model). The panel spans 1m + 1s
  intervals, multiple horizons (5min/15min/1h/4h for buckets; 30s/1min/5min
  for 1s regression; 30min/1h/4h for 1m regression), and models
  (lgbm/logreg for classification, linreg for regression).

  The bench writes `_compare.json` with one entry per cell containing
  `delta_headline` (signed) vs baseline. Your feature is ACCEPTED only
  when it improves the headline on enough cells without a major regression
  on any cell. The exact rule is given in the experiment setting.

  Test-split metrics are HIDDEN at this layer to prevent test leakage; you
  only see val-side deltas. Eval is deterministic — same code → same
  metrics.

auto_alpha_source_data: |-
  Input DataFrame columns (bar-CLOSE convention, UTC timestamps):
    - timestamp: datetime64, right-closed boundary of the bar
    - open, high, low, close: float64 prices
    - volume: float64 base-asset volume
  Index is integer row position, sorted ascending in time. The frame may span
  the target day plus trailing days (label lookups handled upstream).
  Treat it as one contiguous chronological window.

auto_alpha_output_format: |-
  Return a pandas Series:
    - same length and same index as the input DataFrame
    - dtype coercible to float64
    - NaN in the warmup region (never back-fill / forward-fill / zero-fill)
    - deterministic: identical input must produce identical output

auto_alpha_interface: |-
  The feature plugin file MUST follow this exact contract (full spec below):

  ```python
  from __future__ import annotations

  import pandas as pd

  from . import register


  @register("<feature_name>")
  def <feature_name>(df: pd.DataFrame, <param>: <type> = <default>) -> pd.Series:
      """One-line description."""
      # vectorized pandas / numpy only, no row loops, no I/O
      ...
      return out  # pd.Series, NaN in warmup region
  ```

  Full contract pasted verbatim from the playground's FEATURE_SPEC.md:

  -----8<----- FEATURE_SPEC.md -----8<-----
  {{ feature_spec }}
  -----8<----- /FEATURE_SPEC.md -----8<-----

auto_alpha_simulator: |-
  External subprocess (run in `{{ playground_path }}`):

      python -m bench run --features <feature_col> --cells {{ bench_cells }}

  This featurizes (cached by feature-set hash) + sweeps the panel + writes
  `runs/bench/<tag>/_compare.json`. The digest has shape:

  ```json
  {
    "schema_version": 1,
    "compared_on": "val",
    "headline_columns": {
      "classification": "val_acc",
      "regression":     "val_ic_pearson"
    },
    "cells": [
      {
        "interval": "1m", "label_kind": "bucket", "horizon_s": 900,
        "model": "lgbm", "task": "classification",
        "headline_metric": "val_acc",
        "baseline_headline": 0.731, "bench_headline": 0.733,
        "delta_headline": 0.002,
        "delta_ic_p": ..., "delta_icir_p": ..., "delta_acc": ...
      },
      ...
    ]
  }
  ```

  The R&D loop counts cells with `delta_headline > 0` and inspects the
  worst cell's drop, then accept/reject and feeds back to the next round.

auto_alpha_rich_style_description: |-
  ## Auto-Alpha Mining (bench panel)

  An autonomous loop that proposes, codes, and benchmarks pandas-based
  feature plugins for BTCUSDT spot. Each candidate is swept across the
  bench panel (classification + regression × intervals × horizons × models).
  Acceptance requires improvement on enough cells AND no major regression.

auto_alpha_experiment_setting: |-
  Playground path: `{{ playground_path }}`. Each round runs
  `python -m bench run --features <factor> --cells {{ bench_cells }}`.

  Baseline feature columns (your candidate is appended to these; do NOT
  propose a feature that produces an identical column name):
  {% for col in baseline_feature_columns %}  - {{ col }}
  {% endfor %}

  Registered plugin names already in the playground's featurizer/features/
  (your @register("...") string must NOT be any of these — collision will hard-fail):
  {% for name in baseline_feature_names %}  - {{ name }}
  {% endfor %}

  **Acceptance rule (this session):**
    - At least {{ accept_min_improved_cells }} cells must have
      `delta_headline > 0` (headline = val_acc for classification,
      val_ic_pearson for regression).
    - No cell may have `delta_headline < -{{ accept_max_drop }}` (worst-case
      regression guard — protects against trade-offs that buy one task at
      another's expense).
    - Both conditions must hold simultaneously.

  Headline metrics are "higher is better":
    - classification (`bucket_binary` label) → **val_acc** (↑)
    - regression (`forward_logret` label)    → **val_ic_pearson** (↑, signed)

  Notes for designing a robust factor:
    - A factor that wins ONE cell by 0.05 but tanks another by 0.02 will
      still get rejected. Prefer ideas that capture a real, broad signal —
      microstructure, volatility regime, momentum at multiple scales —
      over narrowly-tuned tricks.
    - 1s and 1m data behave differently (noise floor, autocorrelation,
      regime transitions). A truly good factor improves headline on BOTH
      interval families.
    - Classification and regression headlines can diverge (lgbm can
      memorize cliffs that linreg can't extract). Aim for ideas that
      lift both simultaneously.

# ------------------------------------------------------------------
# Hypothesis generation (used by AutoAlphaFactorHypothesisGen)
# ------------------------------------------------------------------

auto_alpha_hypothesis_output_format: |-
  Return strict JSON of the shape:

  ```json
  {
    "hypothesis": "A single concise sentence describing the feature idea you want to test.",
    "reason": "Why this hypothesis is worth testing given prior trace feedback.",
    "concise_reason": "1-line tl;dr of `reason`",
    "concise_observation": "What you observed in prior feedback (or 'first round').",
    "concise_justification": "1-line theoretical / empirical justification.",
    "concise_knowledge": "What this round will teach us if it accepts/rejects."
  }
  ```

auto_alpha_hypothesis_specification: |-
  Constraints on the hypothesis:
  - It must describe exactly ONE feature direction (not a family, not a sweep).
  - It must NOT propose anything that requires future data (no shift(-n), no
    .iloc[i+k:], no resampling that pulls forward).
  - It must be implementable as a vectorized pandas function in <80 lines.
  - It must not duplicate any feature already in the trace's accepted set.
  - **Baseline already contains these feature columns** (your candidate must
    add information BEYOND what these capture):
    {% for col in baseline_feature_columns %}- `{{ col }}`
    {% endfor %}
  - **Already-registered plugin names** (your @register("name") MUST be a
    new name; collision with any of these will hard-fail the round):
    {% for name in baseline_feature_names %}- `{{ name }}`
    {% endfor %}
  - **Previously proposed in this session** (DO NOT propose any of these
    again — accepted ones are already in baseline, rejected ones already
    failed and re-trying with cosmetic changes is wasted budget):
    Accepted: {% if prior_accepted_names %}{{ prior_accepted_names | join(", ") }}{% else %}(none yet){% endif %}
    Rejected: {% if prior_rejected_names %}{{ prior_rejected_names | join(", ") }}{% else %}(none yet){% endif %}
  - Prefer named simple ideas (ATR, Choppiness, OBV-EMA, Range Expansion,
    True-Strength-Index, volume-weighted skew, etc.) over novel constructions
    until the easy wins are exhausted.
  - **Acceptance bar:** the candidate is accepted only when its bench
    digest shows ≥ N cells improved on the val headline AND no cell's
    headline drops beyond the worst-case tolerance. See the experiment
    setting for the exact N and tolerance. Aim for broadly improving
    signals, not narrowly-tuned wins.

# ------------------------------------------------------------------
# Hypothesis -> Experiment (used by AutoAlphaFactorHypothesis2Experiment)
# ------------------------------------------------------------------

auto_alpha_experiment_output_format: |-
  Return strict JSON with EXACTLY ONE top-level key (the snake_case
  feature name that will be passed to @register(...)):

  ```json
  {
    "<feature_name>": {
      "description": "One paragraph describing what the feature computes.",
      "formulation": "Math/pseudocode formulation referencing input columns.",
      "variables": {"window": 14, "n": 1}
    }
  }
  ```

  - `<feature_name>` must match `^[a-z][a-z0-9_]*$`.
  - `<feature_name>` MUST NOT be any of these already-registered names
    (collision = hard fail):
    {% for name in baseline_feature_names %}- `{{ name }}`
    {% endfor %}
  - `<feature_name>` MUST NOT match any previously proposed name in this
    session (accepted ones are in baseline already; rejected ones already
    failed and proposing them again wastes the round):
    {% if prior_accepted_names or prior_rejected_names %}    Accepted: {% if prior_accepted_names %}{{ prior_accepted_names | join(", ") }}{% else %}(none yet){% endif %}
    Rejected: {% if prior_rejected_names %}{{ prior_rejected_names | join(", ") }}{% else %}(none yet){% endif %}{% else %}    (no prior proposals yet){% endif %}
  - `variables` is a flat dict of parameter defaults; each entry must be a
    JSON scalar (int, float, str, bool). No nested dicts, no lists.
  - DO NOT include the actual Python code here — only the spec. The coder
    will translate this spec into code in a separate step.

# ------------------------------------------------------------------
# Trace rendering helpers (used by both proposal classes)
# ------------------------------------------------------------------

hypothesis_and_feedback: |-
  {% for exp, fb in trace.hist -%}
  - Round {{ loop.index0 }}: hypothesis="{{ exp.hypothesis.hypothesis if exp.hypothesis else '?' }}"
    decision={{ fb.decision if fb else 'n/a' }}
    reason="{{ fb.reason if fb else '?' }}"
  {% endfor %}

last_hypothesis_and_feedback: |-
  Hypothesis:
    {{ experiment.hypothesis.hypothesis if experiment.hypothesis else '?' }}
  Reason:
    {{ experiment.hypothesis.reason if experiment.hypothesis else '?' }}
  Result envelope (excerpt):
    {{ experiment.result if experiment.result is defined else '(none)' }}
  Feedback:
    {{ feedback }}

# ------------------------------------------------------------------
# Coder prompts (used by AutoAlphaFactorCoder)
# ------------------------------------------------------------------

auto_alpha_coder:
  system_prompt: |-
    You are a senior quant developer implementing alpha factors as pandas
    vectorized functions. You write production-quality Python that respects a
    strict contract (look-ahead is forbidden; only numpy/pandas math allowed).

    Scenario context:
    -----
    {{ scenario }}
    -----

    Authoritative feature contract (verbatim):
    -----
    {{ feature_spec }}
    -----

    Output rules:
    - Reply with ONE python code block containing the full file content.
    - The file must contain exactly ONE @register("<name>") decorated function.
    - The function name must match the registered name.
    - No surrounding prose, no markdown, no test code, no comments outside the
      function docstring.

  user_prompt: |-
    Implement the following factor. Use ONLY numpy and pandas (and math from
    stdlib). Vectorized. No look-ahead. NaN in warmup region.

    factor_name: {{ factor_name }}
    description: {{ factor_description }}
    formulation: {{ factor_formulation }}
    variables (defaults): {{ variables }}

    Hypothesis context:
    {{ hypothesis }}

    Write the complete file as a single python code block. Begin with the
    `from __future__ import annotations` line.
